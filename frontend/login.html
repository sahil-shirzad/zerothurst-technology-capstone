<!DOCTYPE html>
<html>
<head>
<title>SecureTrack Login</title>
<style>
body{
background:#07111f;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.login{
background:#102a43;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 0 30px rgba(0,0,0,.5);
}

input{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#38bdf8;
border:none;
border-radius:8px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="login">
<h2>Zerothurst SecureTrack</h2>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button>Login</button>

</div>

</body>
</html>
