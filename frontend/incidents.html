<!DOCTYPE html>
<html>
<head>
<title>Incident Management</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
}

th,td{
    border:1px solid #334155;
    padding:12px;
}

th{
    background:#0ea5e9;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#0ea5e9;
    color:white;
    border:none;
    border-radius:5px;
}
</style>
</head>

<body>

<h1>Incident Management</h1>

<table>
<tr>
<th>Incident ID</th>
<th>Type</th>
<th>Severity</th>
<th>Status</th>
</tr>

<tr>
<td>INC-001</td>
<td>Phishing</td>
<td>High</td>
<td>Open</td>
</tr>

<tr>
<td>INC-002</td>
<td>Malware</td>
<td>Critical</td>
<td>Investigating</td>
</tr>

<tr>
<td>INC-003</td>
<td>Unauthorized Access</td>
<td>Medium</td>
<td>Resolved</td>
</tr>

</table>

<button>Add Incident</button>

</body>
</html>
