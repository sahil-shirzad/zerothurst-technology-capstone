<!DOCTYPE html>
<html>
<head>
<title>Incident Management</title>

<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#1e293b;
}

th,td{
    border:1px solid #334155;
    padding:12px;
}

th{
    background:#0ea5e9;
}

button{
    margin-top:20px;
    padding:10px 20px;
    background:#0ea5e9;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Incident Management</h1>

<table>
<thead>
<tr>
<th>ID</th>
<th>Title</th>
<th>Severity</th>
<th>Status</th>
</tr>
</thead>

<tbody id="incidentTable">
</tbody>

</table>

<button onclick="loadIncidents()">Refresh Incidents</button>

<script>
async function loadIncidents() {

    try {

        const response = await fetch("http://localhost:8080/incidents");
        const incidents = await response.json();

        let rows = "";

        incidents.forEach(incident => {

            rows += `
            <tr>
                <td>${incident.id}</td>
                <td>${incident.title}</td>
                <td>${incident.severity}</td>
                <td>${incident.status}</td>
            </tr>
            `;

        });

        document.getElementById("incidentTable").innerHTML = rows;

    } catch(error) {

        console.error(error);

    }
}

loadIncidents();
</script>

</body>
</html>
